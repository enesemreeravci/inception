# Standalone FTP server
listen=YES
listen_ipv6=NO
background=NO

# Authentication
anonymous_enable=NO
local_enable=YES
write_enable=YES

# File permissions and logging
local_umask=002
use_localtime=YES
xferlog_enable=YES

# Restrict users to their FTP directory
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/var/www/html

# Runtime and PAM authentication
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd

# Passive FTP configuration
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=${FTP_PASV_ADDRESS}
