
services:
  # ==================== NGINX ====================
  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - wordpress
      - static-site
      - monitor
    ports:
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?Set DOMAIN_NAME in .env}
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception

  # ==================== MARIADB ====================
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    pull_policy: build
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  # ==================== WORDPRESS ====================
  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - mariadb
      - redis
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      WORDPRESS_DOMAIN: ${DOMAIN_NAME:?Set DOMAIN_NAME in .env}
      WORDPRESS_TITLE: ${WP_TITLE:?Set WP_TITLE in .env}
      WORDPRESS_ADMIN_USER: ${WP_ADMIN_USER:?Set WP_ADMIN_USER in .env}
      WORDPRESS_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?Set WP_ADMIN_EMAIL in .env}
      WORDPRESS_USER: ${WP_USER:?Set WP_USER in .env}
      WORDPRESS_USER_EMAIL: ${WP_USER_EMAIL:?Set WP_USER_EMAIL in .env}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  # ==================== REDIS ====================
  redis:
    build: ./requirements/bonus/redis
    image: redis:inception
    pull_policy: build
    restart: unless-stopped
    networks:
      - inception

  # ==================== FTP ====================
  ftp:
    build: ./requirements/bonus/ftp
    image: ftp:inception
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - wordpress
    environment:
      FTP_USER: ${FTP_USER:?Set FTP_USER in .env}
      FTP_PASV_ADDRESS: ${FTP_PASV_ADDRESS:?Set FTP_PASV_ADDRESS in .env}
    secrets:
      - ftp_password
    ports:
      - "127.0.0.1:21:21"
      - "127.0.0.1:21100-21110:21100-21110"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  # ==================== ADMINER ====================
  adminer:
    build: ./requirements/bonus/adminer
    image: adminer:inception
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - mariadb
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - inception

  # ==================== STATIC WEBSITE ====================
  static-site:
    build: ./requirements/bonus/static-site
    image: static-site:inception
    pull_policy: build
    restart: unless-stopped
    networks:
      - inception

  # ==================== MONITOR ====================
  monitor:
    build: ./requirements/bonus/monitor
    image: monitor:inception
    pull_policy: build
    restart: unless-stopped
    networks:
      - inception

# ==================== NETWORK ====================
networks:
  inception:
    driver: bridge

# ==================== VOLUMES ====================
volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:?Set DATA_ROOT in .env}/wordpress

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:?Set DATA_ROOT in .env}/mariadb

# ==================== SECRETS ====================
secrets:
  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt

  ftp_password:
    file: ../secrets/ftp_password.txt
