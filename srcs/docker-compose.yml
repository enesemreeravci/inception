services:
  nginx:
    build: ./requirements/nginx
    image:  nginx:inception
    pull_policy: build
    ports:
      - "443:443"
    restart: unless-stopped
    networks:
      - inception
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?Set DOMAIN_NAME in .env}
    volumes:
      - wordpress_data:/var/www/html

  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    pull_policy: build
    restart: unless-stopped
    networks:
      - inception
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:? Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    pull_policy: build
    restart: unless-stopped
    networks:
      - inception
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      WORDPRESS_DOMAIN: ${DOMAIN_NAME:?Set DOMAIN_NAME in .env}
      WORDPRESS_TITLE: ${WP_TITLE:?Set WP_TITLE in .env}
      WORDPRESS_ADMIN_USER: ${WP_ADMIN_USER:?Set WP_ADMIN_USER in .env}
      WORDPRESS_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?Set WP_ADMIN_PASSWORD in .env}
      WORDPRESS_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?Set WP_ADMIN_EMAIL in .env}
      WORDPRESS_USER: ${WP_USER:?Set WP_USER in .env}
      WORDPRESS_USER_PASSWORD: ${WP_USER_PASSWORD:?Set WP_USER_PASSWORD in .env}
      WORDPRESS_USER_EMAIL: ${WP_USER_EMAIL:?Set WP_USER_EMAIL in .env}
    volumes:
      - wordpress_data:/var/www/html
  adminer:
    build: ./requirements/adminer
    image: adminer:inception
    pull_policy: build
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - inception
    depends_on:
      - mariadb
networks:
  inception:
    driver: bridge

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "/home/eeravci/data/wordpress"

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "/home/eeravci/data/mariadb"
   
